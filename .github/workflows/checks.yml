name: M1 checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/setup-local.py
      - run: python3 scripts/check-references.py
      - run: docker compose build api
      - run: docker compose run --rm --no-deps api composer install --no-interaction --prefer-dist
      - run: docker compose up -d
      - run: docker compose exec -T api php artisan migrate --force
      - run: docker compose exec -T api php artisan test --compact
      - run: docker compose exec -T api php vendor/bin/pint --test
      - run: docker compose exec -T api php vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - run: pnpm check
      - run: pnpm build:mobile:web
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:e2e:web
      - if: always()
        run: docker compose down
